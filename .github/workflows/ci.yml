# MacEMUI CI: `swift test -c release --parallel` and, on a tag, the CHANGELOG version check.
#
# Two toolchains, each Xcode pinned. `macos-26` with Xcode 26.6 (Swift 6.3) is what the apps' CI builds MacEMUI with, so it
# must stay green there; `xcode-27` (macOS 27, Xcode 27.1, GitHub's preview image; not its 27.2 release candidate) is the
# toolchain the package is written for. The package deploys to macOS 26 (Package.swift: `.macOS(.v26)`).
# ShellMetalTests skip when the runner has no Metal device. `swift build` with Xcode 26.6 copies Colormaps.metal into the
# bundle uncompiled; MetalEngine then compiles it from source (issue #16).
# Never `swift build --build-tests -c release` (fails on this toolchain's Swift Build backend).
name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
          - runner: xcode-27
            xcode: '27.1'
            # The org's Mac (macOS 27, Xcode 27.1) while the org variable MACEM_MAC_RUNNER is set; never for a fork PR.
            mac: true
    runs-on: ${{ matrix.mac && vars.MACEM_MAC_RUNNER && !github.event.pull_request.head.repo.fork && fromJSON(vars.MACEM_MAC_RUNNER) || matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            # The Mac runner: its own Xcode.app, chosen per job, never by xcode-select on that Mac.
            export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
            xcodebuild -version | grep -q "^Xcode ${{ matrix.xcode }}$" \
              || echo "::warning::The Mac's Xcode.app is not Xcode ${{ matrix.xcode }}; this leg ran on $(xcodebuild -version | head -1)."
          else
            sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
          fi
          sw_vers
          xcodebuild -version
          swift --version
      - name: Ensure the Metal toolchain component
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
              # No sudo on the Mac runner. The component is installed system-wide by the runner's setup, but Xcode 27
              # also wants it registered for the CI user, which an unprivileged download request does.
              xcodebuild -downloadComponent MetalToolchain || true
              xcrun -sdk macosx metal --version || {
                xcodebuild -showComponent MetalToolchain || true
                echo "::error::No Metal toolchain for $(xcodebuild -version | head -1) on the Mac runner."; exit 1
              }
            fi
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version
      - name: swift test -c release --parallel
        run: swift test -c release --parallel

  version:
    name: CHANGELOG version matches the tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        run: |
          top=$(grep -m1 -E '^## \[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## \[?v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$top" = "$tag" ] || { echo "CHANGELOG top is $top, tag is $tag"; exit 1; }
